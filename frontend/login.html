<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MYTHORA</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 20px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(126, 148, 101, 0.25);
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px -2px rgba(45, 62, 30, 0.05);
    }
    .back-home-link:hover {
      color: #1A2414;
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(93, 112, 72, 0.45);
      transform: translateX(-3px);
      box-shadow: 0 6px 16px -2px rgba(45, 62, 30, 0.1);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .alert-box {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <canvas id="firefly-canvas"></canvas>

  <div class="auth-wrapper">
    <a href="/index.html" class="back-home-link">
      <span>←</span>
      <span>Back to Home</span>
    </a>

    <div class="glass-panel auth-card">
      <div class="auth-header">
        <a href="/index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon">✨</div>
          <span>MYTHORA</span>
        </a>
        <h2>Welcome Back</h2>
        <p style="font-size: 0.92rem; margin-top: 6px;">Sign in to your enchanted creative studio</p>
      </div>

      <div id="alert-box" class="alert-box alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="creator@vyralstudio.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" id="forgot-password-link" style="font-size: 0.8rem; color: var(--emerald-400);">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <span>Sign In to Studio</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Create one free</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/ui-effects.js"></script>
  <script src="/services/api.js"></script>
  <script src="/services/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    // Check if session expired param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      alertBox.textContent = 'Your session has expired. Please log in again.';
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await window.authService.login(email, password);
        const redirect = urlParams.get('redirect') || '/dashboard.html';
        window.location.href = redirect;
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Studio</span>';
      }
    });

    document.getElementById('forgot-password-link').addEventListener('click', (e) => {
      e.preventDefault();
      window.mythicalAlert(
        'A magical reset link has been dispatched to your email address if an account exists under it.',
        'Enchanted Recovery',
        '🌙'
      );
    });
  </script>
</body>
</html>
